[workspace]
resolver = "2"
members = [
    "crates/geargab-core",
    "crates/geargab-net",
    "crates/geargab-gateway"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GearGab Tech Crew"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal workspace crates
geargab-core = { path = "crates/geargab-core" }
geargab-net = { path = "crates/geargab-net" }

# Serialization & Protocols
rosc = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async & Networking
tokio = { version = "1.38", features = ["full"] }
socket2 = "0.5"
if-addrs = "0.12"
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = "0.23"

# Storage & Utilities
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"